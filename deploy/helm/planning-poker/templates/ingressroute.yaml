# entryPoints/tls are values-driven (default: web only, no tls) so the infra repo can flip
# this to also serve websecure without a template change — see infra repo's
# manual-exec/get-rid-of-traefik-proxy-gateway/ Step 1/4.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-strip-api
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}
spec:
  entryPoints:
    {{- range .Values.ingress.entryPoints | default (list "web") }}
    - {{ . }}
    {{- end }}
  routes:
    # Mirrors the old traefik.docker-compose.yml router split exactly: /api and
    # /socket.io go to the backend (only /api gets prefix-stripped — the backend's
    # Express routes have no /api prefix of their own), everything else is the
    # static frontend.
    - match: Host(`{{ .Values.ingress.host }}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      kind: Rule
      middlewares:
        - name: {{ .Release.Name }}-strip-api
      services:
        - name: {{ .Release.Name }}-backend
          port: 80
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-frontend
          port: 80
  {{- with .Values.ingress.tls }}
  tls:
    certResolver: {{ .certResolver }}
  {{- end }}
