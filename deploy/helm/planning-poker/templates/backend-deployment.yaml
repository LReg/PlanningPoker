apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "planning-poker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: planning-poker
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planning-poker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.image.backend.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            # Unset (default) means telemetry/tracing.ts falls back to a console exporter.
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "planning-poker-backend"
            {{- end }}
            - name: DOMAIN
              value: {{ .Values.ingress.host | quote }}
            - name: PROTOCOL
              value: {{ .Values.frontend.protocol | quote }}
            - name: BACKEND_PORT
              value: {{ .Values.backend.port | quote }}
            # Required at any replica count now — session/player state itself lives in Redis
            # (backend/src/services/sessionStore.ts), not just Socket.io fan-out, so unlike
            # musik-star/huntcontrol there's no in-memory fallback to degrade to. See
            # HORIZONTAL-SCALING-GAP.md.
            {{- if .Values.redis.credentialsSecretName }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.credentialsSecretName }}
                  key: password
            - name: REDIS_URL
              value: {{ printf "redis://%s:$(REDIS_PASSWORD)@%s:%d" .Values.redis.user .Values.redis.host (.Values.redis.port | int) | quote }}
            {{- else }}
            - name: REDIS_URL
              value: {{ printf "redis://%s:%d" .Values.redis.host (.Values.redis.port | int) | quote }}
            {{- end }}
            - name: N8NCHAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecretsName }}
                  key: n8n-chat-webhook
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
