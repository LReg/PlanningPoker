# See state/wanted-state/01-cluster-architecture.md and 02-cicd-and-images.md in the infra
# repo for the shape this chart follows (packaging + CI/CD conventions) and 06-migration-runbook.md
# for the per-app cutover flow this values.yaml participates in.

replicaCount: 1

image:
  registry: ghcr.io/lreg
  pullPolicy: IfNotPresent
  frontend:
    repository: planning-poker-frontend
    tag: latest        # bumped to :sha by CI's CD step on every push to main
  backend:
    repository: planning-poker-backend
    tag: latest

# Single Host() the IngressRoute matches — both frontend and /api,/socket.io traffic.
# Currently the staging hostname (Phase 1). Add the real production hostname as a
# second Host() match at cutover — see 01-cluster-architecture.md's ingress section.
ingress:
  host: poker.k3s.lreg0.de

backend:
  port: "8080"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

frontend:
  # From the browser's perspective, not the internal hop — TLS terminates at the old
  # docker Traefik in front of the k3s-bridge sidecar; inside the cluster it's plain HTTP.
  protocol: https
  # This is the staging domain, not the real production one yet — show the
  # "you're on a test server" banner until this app's real hostname is added
  # to the bridge rule.
  production: "false"
  devServer: "true"
  # Where that banner's "visit production" link points. ASSUMPTION: taken from DNS
  # (poker.lreg0.de resolves to the old prod host) — confirm this is the actual
  # production hostname wired into the old deployProd.yml's DOMAIN secret.
  productionAddress: "https://poker.nilsabbing.de"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Created once, by hand, imperatively — same category as the ghcr-pull Secret
# (state/wanted-state/01-cluster-architecture.md's "Secrets: the one thing that doesn't
# go through git"). N8NCHAT/LIT_PROJECT/LIT_DOMAIN are external credentials, not
# generate-fresh app passwords, so they don't fit the auto-generate-or-override
# pattern used for e.g. Postgres passwords — they're pre-existing values pulled from
# the old .env / GitHub Actions secrets, referenced here by name only:
#
#   kubectl create secret generic planning-poker-secrets \
#     -n planning-poker \
#     --from-literal=n8n-chat-webhook='<N8NCHAT value>' \
#     --from-literal=lit-project='<LIT_PROJECT value>' \
#     --from-literal=lit-domain='<LIT_DOMAIN value>'
appSecretsName: planning-poker-secrets
