# Base/shared defaults for every environment. ingress.host, frontend.production, and
# frontend.devServer differ per environment and are deliberately NOT set here — they
# live in the infra repo's gitops/values/ per-environment override files, merged on
# top of this one by each environment's Argo CD Application (multi-source, same
# pattern as gitops/apps/traefik.yaml). See state/wanted-state/01-cluster-architecture.md
# and 02-cicd-and-images.md in infra.
#
# image.tag is the one exception, deliberately set HERE, not in infra: it's bumped
# to the latest commit's sha by ghcr-dev-continuous.yml on every push to main (same
# repo, same GITHUB_TOKEN — no cross-repo credential, PlanningPoker never commits to
# infra). This makes it the "dev tracks trunk" value by default. Prod's values file
# in infra explicitly overrides this with a pinned tag, which is what actually keeps
# prod from moving on every commit — see gitops/values/planning-poker-prod.yaml.

replicaCount: 1

image:
  registry: ghcr.io/lreg
  pullPolicy: IfNotPresent
  tag: "cf77dcb"
  frontend:
    repository: planning-poker-frontend
  backend:
    repository: planning-poker-backend

# Set per-environment in infra (gitops/values/planning-poker-{dev,prod}.yaml).
ingress:
  host: ""
  # websecure: { certResolver: HttpsResolver }   # left absent — adds a second, separate
  # IngressRoute for websecure once set. web's own IngressRoute never carries a tls block,
  # so it's unaffected either way — see templates/ingressroute.yaml's file-level comment.

backend:
  port: "8080"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

frontend:
  # From the browser's perspective, not the internal hop — TLS terminates at the old
  # docker Traefik in front of the k3s-bridge sidecar; inside the cluster it's plain HTTP.
  protocol: https
  # Set per-environment in infra: "false"/"true" for dev/prod respectively — controls
  # the "you're on a test server" banner.
  production: ""
  devServer: ""
  # Where that banner's "visit production" link points — same in every environment
  # (only shown at all when devServer is true), so this one stays shared.
  productionAddress: "https://poker.nilsabbing.de"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Created once, by hand, imperatively, per namespace — same category as the ghcr-pull
# Secret (state/wanted-state/01-cluster-architecture.md's "Secrets: the one thing that
# doesn't go through git"). N8NCHAT is an external credential, not a generate-fresh app
# password, so it doesn't fit the auto-generate-or-override pattern used for e.g.
# Postgres passwords — it's a pre-existing value pulled from the old .env / GitHub
# Actions secrets, referenced here by name only. Needed once per environment namespace
# (planning-poker-dev AND planning-poker-prod each need their own):
#
#   kubectl create secret generic planning-poker-secrets \
#     -n <planning-poker-dev|planning-poker-prod> \
#     --from-literal=n8n-chat-webhook='<N8NCHAT value>'
appSecretsName: planning-poker-secrets

# In-cluster Tempo (ns: monitoring), receiving OTLP directly — same pattern as ai-tracker's
# chart. Empty by default: backend/src/telemetry/tracing.ts falls back to a console exporter
# when unset, so traces work with no collector required. Set per-environment in infra.
otel:
  endpoint: ""

# Set per-environment in infra, once a dedicated per-namespace Redis exists there (same shape as
# musik-star/huntcontrol's redis.*: a bare host/port is enough for an unauthenticated instance,
# user/credentialsSecretName once it's ACL-locked). Unlike those two apps, this isn't optional
# coordination — session/player state itself lives in Redis (backend/src/services/sessionStore.ts,
# see HORIZONTAL-SCALING-GAP.md), so REDIS_URL is always wired into the Deployment regardless of
# replica count.
redis:
  host: ""
  port: 6379
  user: ""
  credentialsSecretName: ""

# Disabled by default so a plain `helm install` behaves exactly as before (replicaCount pods, no
# HPA). templates/backend-hpa.yaml refuses to render if enabled without redis.host set.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  # A fresh pod's own boot (Redis connect, Socket.io adapter attach) briefly reads as load —
  # long enough to cover a normal boot without meaningfully slowing a genuine scale-up. Same
  # value as musik-star/huntcontrol started with.
  scaleUpStabilizationSeconds: 30
