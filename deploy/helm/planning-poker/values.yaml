# Base/shared defaults for every environment. Everything that differs between dev
# and prod (image.tag, ingress.host, frontend.production, frontend.devServer) is
# deliberately NOT set here — it lives in the infra repo's gitops/values/ per-environment
# override files, merged on top of this one by each environment's Argo CD Application
# (multi-source, same pattern as gitops/apps/traefik.yaml). See
# state/wanted-state/01-cluster-architecture.md and 02-cicd-and-images.md in infra.

replicaCount: 1

image:
  registry: ghcr.io/lreg
  pullPolicy: IfNotPresent
  # Set per-environment in infra — either the version tag (e.g. "v1.0.1") or the short
  # commit sha both work: CI pushes each build under both tags for the same image.
  tag: ""
  frontend:
    repository: planning-poker-frontend
  backend:
    repository: planning-poker-backend

# Set per-environment in infra (gitops/values/planning-poker-{dev,prod}.yaml).
ingress:
  host: ""

backend:
  port: "8080"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

frontend:
  # From the browser's perspective, not the internal hop — TLS terminates at the old
  # docker Traefik in front of the k3s-bridge sidecar; inside the cluster it's plain HTTP.
  protocol: https
  # Set per-environment in infra: "false"/"true" for dev/prod respectively — controls
  # the "you're on a test server" banner.
  production: ""
  devServer: ""
  # Where that banner's "visit production" link points — same in every environment
  # (only shown at all when devServer is true), so this one stays shared.
  productionAddress: "https://poker.nilsabbing.de"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Created once, by hand, imperatively, per namespace — same category as the ghcr-pull
# Secret (state/wanted-state/01-cluster-architecture.md's "Secrets: the one thing that
# doesn't go through git"). N8NCHAT/LIT_PROJECT/LIT_DOMAIN are external credentials, not
# generate-fresh app passwords, so they don't fit the auto-generate-or-override pattern
# used for e.g. Postgres passwords — they're pre-existing values pulled from the old
# .env / GitHub Actions secrets, referenced here by name only. Needed once per
# environment namespace (planning-poker-dev AND planning-poker-prod each need their own):
#
#   kubectl create secret generic planning-poker-secrets \
#     -n <planning-poker-dev|planning-poker-prod> \
#     --from-literal=n8n-chat-webhook='<N8NCHAT value>' \
#     --from-literal=lit-project='<LIT_PROJECT value>' \
#     --from-literal=lit-domain='<LIT_DOMAIN value>'
appSecretsName: planning-poker-secrets
